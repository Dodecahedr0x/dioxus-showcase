name: Publish

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Derive release version from tag
        shell: bash
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify committed workspace versions
        run: ./scripts/verify-workspace-version.sh "${{ env.RELEASE_VERSION }}"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # One invocation for the whole workspace. Cargo resolves the publish order
      # from the dependency graph and waits for each crate to land in the index
      # itself, which retires the old chain of per-crate invocations padded with
      # fixed delays. It also covers every publishable member automatically, so a
      # new crate cannot be forgotten here; `example/` is excluded by its own
      # `publish = false`. Requires cargo >= 1.90, which `stable` above provides.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
