# This file is checked in on purpose; every other file in this directory is generated
# by `dioxus-showcase build` and is gitignored.
#
# `dioxus-showcase init` normally writes this manifest with a released `dioxus-showcase`
# version from crates.io. Here it points at the crates in this workspace instead, so that
# running the example exercises your local changes rather than the last published release.
#
# The package version is fixed at 0.0.0 because this crate is never published; keeping it
# out of the workspace version scheme means `scripts/set-workspace-version.sh` has one
# less file to keep in sync.
[package]
name = "dioxus-showcase-example-showcase"
version = "0.0.0"
edition = "2021"
publish = false

# The generated app is its own workspace so it can build for wasm independently of the
# root workspace.
[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
dioxus-showcase = { path = "../../crates/dioxus-showcase" }
dioxus-showcase-ui = { path = "../../crates/dioxus-showcase-ui" }
showcase_entry = { package = "basic-example", path = ".." }

# LTO IS LOAD-BEARING ON WASM. DO NOT REMOVE IT.
#
# Stories register themselves at link time, and `main.rs` refers to the component
# crate only through `use showcase_entry as _;`. On wasm32 that import alone does
# not pull the component crate's object out of its rlib archive: nothing in the
# binary references a symbol inside it, so the linker never selects the archive
# member and every registration in it disappears. Enabling LTO merges the crate
# graph before that selection happens, which is what keeps the registrations.
#
# The failure is SILENT — the app builds, launches, and shows an empty showcase
# with no error anywhere. Verified on Rust 1.94 / Dioxus CLI 0.7.9: without these
# two lines a `dx build` and a `dx bundle --release` both produce zero stories.
#
# `strip` additionally keeps DWARF out of release wasm, which `wasm-opt` aborts on.
[profile.dev]
lto = "thin"

[profile.release]
lto = true
strip = true
